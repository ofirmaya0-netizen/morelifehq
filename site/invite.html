<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invitation — More Life</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/guest.css">
</head>
<body>
<div class="g-wrap">
<a class="g-logo" href="/"><img src="/img/logo.svg" alt="">more life</a>
<main class="g-card" id="card"><p class="eyebrow">Loading…</p></main>
</div>
<script>
(function () {
  var t = new URLSearchParams(location.search).get('t') || '', card = document.getElementById('card');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function date(d) { if (!d) return ''; var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
  function gone(msg) { card.innerHTML = '<h1 class="g-title">Invitation <span class="serif accent">unavailable.</span></h1><p style="color:var(--mute)">' + esc(msg) + '</p><a class="btn" href="/">Go to morelife.events</a>'; }
  fetch('/api/public/invite?t=' + encodeURIComponent(t)).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (r) {
    if (!r.ok) return gone(r.j.error || 'This invitation is not available.');
    var e = r.j.event;
    document.title = e.title + ' — More Life';
    var F = [['name', 'Full name', 'text', 'name', 1], ['email', 'Email', 'email', 'email', 1], ['phone', 'Phone', 'tel', 'tel', 0], ['instagram', 'Instagram', 'text', 'off', 0]];
    card.innerHTML = (e.image ? '<img class="g-img" src="' + esc(e.image) + '" alt="">' : '') +
      '<p class="eyebrow">More Life presents' + (e.visibility === 'private' ? ' · Private invitation' : '') + '</p><h1 class="g-title">' + esc(e.title) + '</h1>' +
      '<div class="g-meta">' + [date(e.date) + (e.time ? ' · ' + e.time : ''), [e.venue, e.city].filter(Boolean).join(', '), e.artist].filter(Boolean).map(function (x) { return '<span class="chip" style="cursor:default">' + esc(x) + '</span>'; }).join('') + '</div>' +
      (e.description ? '<p style="color:var(--mute);white-space:pre-line">' + esc(e.description) + '</p>' : '') +
      '<form class="g-form" id="f" novalidate>' + F.map(function (f) { return '<div class="field"><label for="g-' + f[0] + '">' + f[1] + (f[4] ? '' : ' (optional)') + '</label><input id="g-' + f[0] + '" type="' + f[2] + '" autocomplete="' + f[3] + '"' + (f[4] ? ' required' : '') + '></div>'; }).join('') +
      '<div class="field"><label for="g-guests">Guests, including you</label><input id="g-guests" type="number" min="1" max="10" value="1" inputmode="numeric" required></div>' +
      '<div class="field full"><label for="g-note">Note (optional)</label><textarea id="g-note" style="height:80px"></textarea></div>' +
      '<div class="field" style="position:absolute;left:-9999px" aria-hidden="true"><label for="g-website">Website</label><input id="g-website" tabindex="-1" autocomplete="off"></div>' +
      '<label class="check" for="g-consent"><input id="g-consent" type="checkbox" required><span>More Life may use these details to handle my request for this event. <a href="/#privacy">Privacy</a></span></label>' +
      '<p class="g-msg bad" id="msg" role="alert" style="grid-column:1/-1"></p><div class="actions"><button class="btn" type="submit">Request a place</button></div></form>' +
      (e.ticketUrl ? '<a class="link" href="' + esc(e.ticketUrl) + '" target="_blank" rel="noopener">Tickets ↗</a>' : '');
    document.getElementById('f').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = function (k) { return document.getElementById('g-' + k).value; }, msg = document.getElementById('msg'), btn = this.querySelector('button');
      if (!this.checkValidity()) { msg.textContent = 'Please complete the required fields and tick the box.'; var bad = this.querySelector(':invalid'); if (bad) bad.focus(); return; }
      btn.disabled = true; msg.textContent = '';
      fetch('/api/public/rsvp', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: t, name: v('name'), email: v('email'), phone: v('phone'), instagram: v('instagram'), guests: v('guests'), note: v('note'), website: v('website'), consent: document.getElementById('g-consent').checked }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (r) {
          if (!r.ok) { msg.textContent = r.j.error || 'Something went wrong.'; btn.disabled = false; return; }
          card.innerHTML = '<p class="eyebrow">' + esc(e.title) + '</p><h1 class="g-title">Request <span class="serif accent">received.</span></h1><p style="color:var(--mute)">' + (r.j.duplicate ? 'We already have a request with this email for this event.' : 'This is not a confirmed place yet. If your request is approved, More Life will send you your entry pass.') + '</p><a class="btn btn-ghost" href="/">morelife.events</a>';
        }).catch(function () { msg.textContent = 'Connection error. Please try again.'; btn.disabled = false; });
    });
  }).catch(function () { gone('Connection error. Please try again.'); });
})();
</script>
</body>
</html>
