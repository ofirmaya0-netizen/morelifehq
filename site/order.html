<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your order — More Life</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/guest.css">
</head>
<body>
<div class="g-bg" id="bg" aria-hidden="true" hidden></div>
<div class="g-wrap">
<a class="g-logo" href="/"><img src="/img/logo.svg" alt="">more life</a>
<main class="g-card" id="card"><p class="eyebrow">Loading…</p></main>
</div>
<script>
(function () {
  var t = new URLSearchParams(location.search).get('t') || '', card = document.getElementById('card'), open = '', tries = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function date(d) { if (!d) return ''; var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
  function load() {
    fetch('/api/public/order?t=' + encodeURIComponent(t)).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (r) {
      if (!r.ok) { card.innerHTML = '<h1 class="g-title">Order <span class="serif accent">not found.</span></h1><p style="color:var(--mute)">' + esc(r.j.error || '') + '</p><a class="btn" href="/">Go to morelife.events</a>'; return; }
      draw(r.j);
      // the payment provider can answer a moment after the buyer is back: look again a few times
      if (r.j.order.status === 'pending' && !r.j.order.payUrl && tries++ < 6) setTimeout(load, 2500);
    }).catch(function () { card.innerHTML = '<p style="color:var(--mute)">Could not load your order. Please refresh.</p>'; });
  }
  function draw(d) {
    var o = d.order, e = d.event, money = function (n) { try { return new Intl.NumberFormat('en-GB', { style: 'currency', currency: o.currency, currencyDisplay: 'narrowSymbol', minimumFractionDigits: n % 1 ? 2 : 0 }).format(n); } catch (x) { return n + ' ' + o.currency; } };
    var HEAD = { paid: ['You’re', 'in.'], partial: ['Your', 'order.'], refunded: ['Order', 'refunded.'], pending: ['Payment', 'not completed.'], expired: ['Order', 'expired.'], cancelled: ['Order', 'cancelled.'] }[o.status] || ['Your', 'order.'];
    var where = [e.venue, e.city].filter(Boolean).join(', '), live = d.tickets.filter(function (x) { return x.status === 'valid'; });
    if (e.image) { var bg = document.getElementById('bg'); bg.style.backgroundImage = 'url(' + e.image + ')'; bg.hidden = false; }
    card.innerHTML = '<span class="g-pill">Order ' + esc(o.no) + '</span><h1 class="g-title">' + HEAD[0] + ' <span class="serif accent">' + HEAD[1] + '</span></h1>' +
      '<p style="color:var(--mute)"><b style="color:var(--ink)">' + esc(e.title) + '</b><br>' + esc(date(e.date) + (e.time ? ' · ' + e.time : '')) + (where ? '<br>' + esc(where) : '') + '</p>' +
      (o.status === 'pending' ? '<p class="g-msg bad">' + (o.error ? esc(o.error) + ' ' : '') + 'No money was taken. Your tickets are held until ' + new Date(o.expiresAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '.</p>' + (o.payUrl ? '<a class="btn" href="' + esc(o.payUrl) + '">Complete payment</a>' : (e.url ? '<a class="btn" href="' + esc(e.url) + '">Back to the event</a>' : '')) : '') +
      (o.status === 'expired' || o.status === 'cancelled' ? '<p class="g-msg bad">This order was not paid in time and its tickets went back on sale. No money was taken.</p>' + (e.url ? '<a class="btn" href="' + esc(e.url) + '">Back to the event</a>' : '') : '') +
      (o.refunded ? '<p class="g-msg">Refunded: ' + money(o.refunded) + '. It can take a few working days to reach your account.</p>' : '') +
      (d.tickets.length ? '<div class="sh-list">' + d.tickets.map(function (x) {
        var ok = x.status === 'valid';
        return '<div class="sh-row' + (ok ? '' : ' off') + '"><div class="sh-main"><b>' + esc(x.type) + '</b><span>' + esc(x.name) + (x.checkedIn ? ' · used at the door' : '') + (ok ? '' : ' · refunded, no longer valid') + '</span></div>' +
          (ok ? '<div class="sh-acts"><a class="btn" href="' + esc(x.url) + '">Open ticket</a>' + (d.transfers && !x.checkedIn ? '<button class="btn quiet" type="button" data-name="' + x.id + '">Change name</button>' : '') + '</div>' : '') +
          (open === x.id ? '<form class="g-form sh-move" data-move="' + x.id + '"><div class="field"><label for="mv-n">Full name on the ticket</label><input id="mv-n" name="name" required value="' + esc(x.name) + '"></div><div class="field"><label for="mv-e">Their email <span style="opacity:.6">(only when giving it to someone else)</span></label><input id="mv-e" name="email" type="email" placeholder="' + esc(o.email) + '"></div><p class="sh-note" style="grid-column:1/-1">With a new email, that person receives the ticket with a new QR code and this one stops working.</p><p class="g-msg" role="alert" style="grid-column:1/-1"></p><button class="btn" type="submit" style="grid-column:1/-1">Save</button></form>' : '') + '</div>';
      }).join('') + '</div>' : '') +
      '<div class="sh-sum">' + o.items.map(function (i) { return '<div><span>' + i.qty + ' × ' + esc(i.name) + '</span><b>' + (i.unitNet ? money(i.unitNet * i.qty) : 'Free') + '</b></div>'; }).join('') + (o.fee ? '<div><span>Service fee</span><b>' + money(o.fee) + '</b></div>' : '') + '<div class="tot"><span>Total</span><b>' + (o.total ? money(o.total) : 'Free') + '</b></div></div>' +
      (live.length ? '<p class="sh-note">We also sent these tickets to ' + esc(o.email) + '. Keep this page private: anyone with the link can open the tickets.</p>' : '') +
      (d.support ? '<p class="sh-note">Questions about this order: <a class="link" href="mailto:' + esc(d.support) + '?subject=Order%20' + esc(o.no) + '">' + esc(d.support) + '</a></p>' : '');
  }
  card.addEventListener('click', function (ev) { var b = ev.target.closest('[data-name]'); if (b) { open = open === b.getAttribute('data-name') ? '' : b.getAttribute('data-name'); tries = 9; load(); } });
  card.addEventListener('submit', function (ev) {
    var f = ev.target.closest('[data-move]'); if (!f) return; ev.preventDefault();
    var msg = f.querySelector('.g-msg'), btn = f.querySelector('button'); btn.disabled = true; msg.className = 'g-msg'; msg.textContent = 'Saving…';
    fetch('/api/public/ticket', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ o: t, ticketId: f.getAttribute('data-move'), name: f.querySelector('[name=name]').value, email: f.querySelector('[name=email]').value.trim() }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong.'); return j; }); })
      .then(function () { open = ''; load(); }).catch(function (err) { btn.disabled = false; msg.className = 'g-msg bad'; msg.textContent = err.message; });
  });
  load();
})();
</script>
</body>
</html>
