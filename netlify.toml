[build]
  command = "npm run build"
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/invite"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/offer"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/venue"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/promoter"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/my-tickets"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/order"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/pass"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

# The admin e-mail is the public contact address already shown on the site, so it is not a secret to scan for.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "HQ_ADMIN_EMAIL"
