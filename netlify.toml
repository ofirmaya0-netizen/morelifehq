[build]
  command = "npm run build"
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/invite"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/pass"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
